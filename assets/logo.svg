<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect width="256" height="256" fill="#0e1a2b"/>
  
  <!-- Four interlocking rounded squares forming the bow -->
  <g fill="none" stroke="#ffd166" stroke-width="5">
    <!-- Top-left square -->
    <rect x="62" y="42" width="52" height="52" rx="12" ry="12"/>
    <!-- Top-right square -->
    <rect x="108" y="42" width="52" height="52" rx="12" ry="12"/>
    <!-- Bottom-left square -->
    <rect x="62" y="88" width="52" height="52" rx="12" ry="12"/>
    <!-- Bottom-right square -->
    <rect x="108" y="88" width="52" height="52" rx="12" ry="12"/>
    
    <!-- Interlocking corner accents -->
    <path d="M114 68 L114 82 L108 82"/>
    <path d="M114 68 L114 82 L108 82" transform="rotate(90 111 75)"/>
    <path d="M114 68 L114 82 L108 82" transform="rotate(180 111 75)"/>
    <path d="M114 68 L114 82 L108 82" transform="rotate(270 111 75)"/>
  </g>
  
  <!-- Keyhole cutout in bow center -->
  <path d="M100 85 A10 10 0 1 1 122 85 A10 10 0 1 1 100 85 M106 92 L106 110 A5 5 0 0 0 116 110 L116 92 Z" fill="#2f81f7"/>
  <circle cx="111" cy="85" r="4" fill="#0e1a2b"/>
  
  <!-- Key shaft extending from bow -->
  <rect x="107" y="138" width="10" height="72" rx="3" fill="#ffd166"/>
  
  <!-- Key bit / teeth -->
  <path d="M117 170 L142 170 L142 178 L130 178 L130 186 L142 186 L142 194 L117 194 Z" fill="#ffd166"/>
  
  <!-- Shaft-to-bow connector -->
  <rect x="104" y="134" width="16" height="10" rx="3" fill="#ffd166"/>
  
  <!-- Subtle detail lines on shaft -->
  <line x1="110" y1="150" x2="110" y2="162" stroke="#e6edf3" stroke-width="1.5" opacity="0.5"/>
  <line x1="114" y1="150" x2="114" y2="162" stroke="#e6edf3" stroke-width="1.5" opacity="0.5"/>
  
  <!-- Small trust accent - lock notch detail -->
  <path d="M134 178 L134 186" stroke="#0e1a2b" stroke-width="2"/>
  
  <!-- Wordmark (small, optional) -->
  <text x="128" y="232" font-family="monospace" font-size="9" fill="#e6edf3" text-anchor="middle" letter-spacing="2" opacity="0.7">OFFICE-ACTIVATION-SUITE</text>
</svg>
